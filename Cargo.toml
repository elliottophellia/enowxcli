[workspace]
members = ["crates/enowx-core", "crates/enowx-tui", "crates/enowx-cli"]
default-members = ["crates/enowx-cli"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
enowx-core = { path = "crates/enowx-core" }
enowx-tui = { path = "crates/enowx-tui" }

anyhow = "1"
async-trait = "0.1"
crossterm = "0.28"
ratatui = "0.29"
textwrap = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
