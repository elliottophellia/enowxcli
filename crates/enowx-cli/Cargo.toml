[package]
name = "enowx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "enowxcli coding agent with the enowx terminal interface"

# Keep the shipped binary named `enx` so `enx` on PATH still runs the same
# command after the crate rename.
[[bin]]
name = "enowx"
path = "src/main.rs"

[dependencies]
enowx-core.workspace = true
enowx-tui.workspace = true

anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
serde_json.workspace = true
tokio.workspace = true
